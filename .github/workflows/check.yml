name: Check

# The Pages workflow runs these too, but only on `main`, which means a problem
# is found at publish time with the broken commit already merged. This runs the
# same gate on the pull request, where it is still cheap to fix.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose. `packageManager` in package.json already
      # pins pnpm, and specifying both makes the action fail rather than
      # choosing one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Build too. Typechecking passes on things the static export still
      # refuses, and a route that cannot be prerendered should fail here rather
      # than on the deploy that follows the merge.
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: pnpm build

  # Every Rust snippet on the DSA in Rust pages is a real file in this crate,
  # and the pages are built from it. If a snippet stops compiling or a test
  # fails, the lesson that shows it is wrong, so this fails the pull request.
  rust:
    name: Rust snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: rust/rust-dsa
        run: cargo test

      # The Playground link on each lesson must also compile on its own, not
      # only inside the crate. This builds every link with rustc.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playground links compile
        run: pnpm check:playground
