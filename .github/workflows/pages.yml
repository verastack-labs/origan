name: Pages

on:
  push:
    branches: [main]
  # So the site can be republished without an empty commit, which is what you
  # want the first time something is wrong with the deploy rather than with the
  # code.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight. A superseded build is
# wasted minutes; a cancelled deploy can leave the published site in a state
# that matches no commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose. `packageManager` in package.json already
      # pins pnpm, and specifying both makes the action fail rather than
      # choosing one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Everything that can fail cheaply runs before anything is published.
      # This is the only workflow whose output the public sees, so the bar for
      # what it will push is higher than for a pull request check.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:contrast
      - run: pnpm check:components

      - name: Build
        env:
          # Served from the root of its own domain, origan.verastack.dev, so
          # there is no project path to prefix. Kept as an explicit empty value
          # rather than removed, so moving back under a path is a one-line
          # change.
          NEXT_PUBLIC_BASE_PATH: ""
          # Set this as a repository variable once the Search Console property
          # exists. Absent, the verification tag is omitted rather than shipped
          # empty, which Google reads as a failed check.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: pnpm build

      # Stops Pages running the output through Jekyll, which would drop every
      # path beginning with an underscore. Next puts its entire static bundle
      # under `_next`, so without this the site publishes with no CSS and no
      # JavaScript and looks broken rather than absent.
      - name: Disable Jekyll processing
        run: touch .next-build/.nojekyll

      - uses: actions/configure-pages@v5

      # `.next-build`, not `out`. Setting `distDir` makes the static export land
      # in that directory itself, and there is no `out` to find.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .next-build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and the other IndexNow engines) which pages exist straight after
  # a deploy, instead of waiting for a re-crawl. ChatGPT search leans on Bing's
  # index, so this is how new lessons reach it quickly. The key is public by
  # design: it only proves the site owns the key file at its root.
  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit every sitemap URL
        env:
          KEY: 70b7e8594ca972aac7e7dba8208b4655
          HOST: origan.verastack.dev
        run: |
          sleep 30
          curl -fsSL "https://$HOST/sitemap.xml" -o sitemap.xml
          node -e '
            const fs = require("fs");
            const urls = [...fs.readFileSync("sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            const { HOST, KEY } = process.env;
            fs.writeFileSync("body.json", JSON.stringify({ host: HOST, key: KEY, keyLocation: `https://${HOST}/${KEY}.txt`, urlList: urls.slice(0, 10000) }));
            console.log(`Submitting ${urls.length} URLs`);
          '
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow responded $code"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow returned $code" ;; esac

